server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ─────────────────────────────────────────────────────
    # Prevent this site from being embedded in iframes on other origins.
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Stop browsers from MIME-sniffing the Content-Type.
    add_header X-Content-Type-Options "nosniff" always;
    # Reduce referrer information sent to third-party sites.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Restrict access to sensitive browser APIs.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Content Security Policy — allows same-origin resources + the SMTP-email
    # inline styles used by templates.  Tighten further once asset origins are known.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none';" always;
    # HSTS — uncomment this line once HTTPS / TLS is configured on this server.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # ─────────────────────────────────────────────────────────────────────────

    # Proxy all API calls to the backend — keeps port 5000 off the public internet
    location /api/ {
        proxy_pass http://server:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Proxy public uploads (carousel images)
    location /public-uploads/ {
        proxy_pass http://server:5000/public-uploads/;
        proxy_set_header Host $host;
    }

    location /uploads/ {
        proxy_pass http://server:5000/uploads/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
