services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: scholarship_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@db:5432/scholarship_db
      NODE_ENV: production
      PORT: 5000
      PRIMARY_ADMIN_EMAIL: ${PRIMARY_ADMIN_EMAIL:-data@vigancity.gov.ph}
    # Port 5000 is intentionally NOT exposed to the host.
    # All API traffic is routed through Nginx on port 80 via the /api/ proxy block.
    volumes:
      - uploads:/app/uploads

  client:
    build:
      context: ./client
      args:
        # Relative URLs so the browser never sees the backend IP or port.
        # Nginx proxies /api/* to the server container internally.
        VITE_API_BASE_URL: /api
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "80:80"

volumes:
  pgdata:
  uploads:
